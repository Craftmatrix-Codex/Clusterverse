name: Clusterverse

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clusterverse-deploy
  cancel-in-progress: false

env:
  IMAGE: 100.121.206.107:5000/clusterverse:${{ github.sha }}
  MOTHERSHIP: ${{ secrets.MOTHERSHIP_USER }}@${{ secrets.MOTHERSHIP_HOST }}
  APP_URL: https://dev.craftmatrix.org

jobs:
  validate:
    name: Validate Clusterverse
    runs-on: [self-hosted, linux, x64, polyos, doom, clusterverse]
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate PHP and frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          touch database/database.sqlite
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
          php artisan key:generate --force
          php artisan wayfinder:generate
          php artisan migrate --force
          pnpm install --frozen-lockfile
          pnpm run lint:check
          pnpm run format:check
          pnpm run types:check
          pnpm run build
          vendor/bin/pint --test
          APP_ENV=testing APP_URL=http://localhost php artisan test --compact

  build:
    name: Build and push Clusterverse image
    needs: validate
    runs-on: [self-hosted, linux, x64, polyos, doom, clusterverse]
    environment: clusterverse
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare secure SSH
        shell: bash
        env:
          MOTHERSHIP_SSH_KEY: ${{ secrets.MOTHERSHIP_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$MOTHERSHIP_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
      - name: Build and push on Mothership
        shell: bash
        env:
          MOTHERSHIP_HOST: ${{ secrets.MOTHERSHIP_HOST }}
          MOTHERSHIP_USER: ${{ secrets.MOTHERSHIP_USER }}
          REGISTRY_PASSWORD: ${{ secrets.POLYOS_REGISTRY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          touch database/database.sqlite
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
          php artisan key:generate --force
          php artisan wayfinder:generate
          pnpm install --frozen-lockfile
          pnpm run build
          ssh_opts=(-i "$RUNNER_TEMP/ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          build_dir="/tmp/clusterverse-build-${GITHUB_SHA}"
          tar --exclude=.git --exclude=vendor --exclude=node_modules -czf - . \
            | ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" "rm -rf '$build_dir' && mkdir -p '$build_dir' && tar -xzf - -C '$build_dir'"
          printf '%s' "$REGISTRY_PASSWORD" \
            | ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" \
              "docker login 100.121.206.107:5000 --username registry-admin --password-stdin >/dev/null && docker build --pull -t '$IMAGE' '$build_dir' && docker push '$IMAGE' && docker image inspect '$IMAGE' --format 'IMAGE_DIGEST={{index .RepoDigests 0}}'"
          ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" "rm -rf '$build_dir'"

  deploy:
    name: Deploy Clusterverse to Kubernetes
    needs: build
    runs-on: [self-hosted, linux, x64, polyos, doom, clusterverse]
    environment: clusterverse
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Deploy application and owned Caddy route
        shell: bash
        env:
          MOTHERSHIP_HOST: ${{ secrets.MOTHERSHIP_HOST }}
          MOTHERSHIP_USER: ${{ secrets.MOTHERSHIP_USER }}
          MOTHERSHIP_SSH_KEY: ${{ secrets.MOTHERSHIP_SSH_KEY }}
          REGISTRY_PASSWORD: ${{ secrets.POLYOS_REGISTRY_PASSWORD }}
          CLUSTERVERSE_APP_KEY: ${{ secrets.CLUSTERVERSE_APP_KEY }}
          CLUSTERVERSE_PGHOST: ${{ secrets.CLUSTERVERSE_PGHOST }}
          CLUSTERVERSE_PGPORT: ${{ secrets.CLUSTERVERSE_PGPORT }}
          CLUSTERVERSE_PGDATABASE: ${{ secrets.CLUSTERVERSE_PGDATABASE }}
          CLUSTERVERSE_RUNTIME_DBUSER: ${{ secrets.CLUSTERVERSE_RUNTIME_DBUSER }}
          CLUSTERVERSE_RUNTIME_DBPASSWORD: ${{ secrets.CLUSTERVERSE_RUNTIME_DBPASSWORD }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$MOTHERSHIP_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          ssh_opts=(-i "$RUNNER_TEMP/ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          remote_dir="/tmp/clusterverse-deploy-${GITHUB_SHA}"
          ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          scp "${ssh_opts[@]}" deploy/k8s/clusterverse.yaml deploy/k8s/caddy.yaml deploy/k8s/caddy-routes/dev-clusterverse.yaml "$MOTHERSHIP_USER@$MOTHERSHIP_HOST:$remote_dir/"
          runtime_env=$(printf '%s\n' \
            "APP_NAME=Clusterverse" "APP_ENV=production" "APP_DEBUG=false" "APP_KEY=$CLUSTERVERSE_APP_KEY" "APP_URL=$APP_URL" \
            "DB_CONNECTION=pgsql" "DB_HOST=$CLUSTERVERSE_PGHOST" "DB_PORT=$CLUSTERVERSE_PGPORT" "DB_DATABASE=$CLUSTERVERSE_PGDATABASE" \
            "DB_USERNAME=$CLUSTERVERSE_RUNTIME_DBUSER" "DB_PASSWORD=$CLUSTERVERSE_RUNTIME_DBPASSWORD" \
            | base64 -w0)
          printf '%s' "$runtime_env" | ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" \
            "set -Eeuo pipefail; install -d -m 700 /opt/clusterverse/shared; base64 -d > /opt/clusterverse/shared/.env; chmod 600 /opt/clusterverse/shared/.env"
          ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" "kubectl create namespace clusterverse --dry-run=client -o yaml | kubectl apply -f - >/dev/null"
          printf '%s\n' "$REGISTRY_PASSWORD" | ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" "read -r registry_password; kubectl create secret docker-registry clusterverse-registry --namespace clusterverse --docker-server=100.121.206.107:5000 --docker-username=registry-admin --docker-password=\"\$registry_password\" --dry-run=client -o yaml | kubectl apply -f -"
          ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" "kubectl create secret generic clusterverse-env --namespace clusterverse --from-env-file=/opt/clusterverse/shared/.env --dry-run=client -o yaml | kubectl apply -f -; kubectl apply -f '$remote_dir/clusterverse.yaml'; kubectl -n clusterverse set image deployment/clusterverse clusterverse='$IMAGE'; kubectl -n clusterverse rollout status deployment/clusterverse --timeout=300s; kubectl -n clusterverse exec deployment/clusterverse -- php artisan migrate --force"
          ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" "flock -w 120 /tmp/caddy-deploy.lock bash -c \"set -Eeuo pipefail; kubectl apply --dry-run=server -f '$remote_dir/dev-clusterverse.yaml' >/dev/null; kubectl apply -f '$remote_dir/dev-clusterverse.yaml'; kubectl -n polyos rollout restart deployment/caddy; kubectl -n polyos rollout status deployment/caddy --timeout=180s\""
          ssh "${ssh_opts[@]}" "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" "rm -rf '$remote_dir'"

  rollback:
    name: Roll back failed Clusterverse deployment
    needs: [deploy]
    if: ${{ needs.deploy.result == 'failure' }}
    runs-on: [self-hosted, linux, x64, polyos, doom, clusterverse]
    environment: clusterverse
    timeout-minutes: 10
    steps:
      - name: Roll back Kubernetes deployment
        shell: bash
        env:
          MOTHERSHIP_HOST: ${{ secrets.MOTHERSHIP_HOST }}
          MOTHERSHIP_USER: ${{ secrets.MOTHERSHIP_USER }}
          MOTHERSHIP_SSH_KEY: ${{ secrets.MOTHERSHIP_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$MOTHERSHIP_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "$MOTHERSHIP_USER@$MOTHERSHIP_HOST" 'kubectl -n clusterverse rollout undo deployment/clusterverse && kubectl -n clusterverse rollout status deployment/clusterverse --timeout=300s'

  verify:
    name: Verify Clusterverse live route
    needs: deploy
    runs-on: [self-hosted, linux, x64, polyos, doom, clusterverse]
    timeout-minutes: 10
    steps:
      - name: Verify HTTPS GET
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --output /tmp/clusterverse-response --write-out '%{http_code}' --location --max-time 20 https://dev.craftmatrix.org/up || true)"
            root_status="$(curl --silent --show-error --output /tmp/clusterverse-root --write-out '%{http_code}' --location --max-time 20 https://dev.craftmatrix.org/ || true)"
            if [ "$status" = 200 ] && [ "$root_status" = 200 ]; then
              printf 'Clusterverse GET /up: HTTP %s; /: HTTP %s\n' "$status" "$root_status"
              exit 0
            fi
            printf 'Attempt %s: HTTP %s\n' "$attempt" "$status"
            sleep 10
          done
          printf 'Clusterverse live verification failed\n' >&2
          exit 1
